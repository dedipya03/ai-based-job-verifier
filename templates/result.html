<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prediction Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Prediction Result</h2>
        <p>This job is predicted to be:
            <strong class="{{ 'real' if prediction == 'Real' else 'fake' }}">{{ prediction }}</strong>
        </p>
        <p>Confidence Score: <strong>{{ confidence }}%</strong></p>
        <a href="/">🔙 Go Back</a>
    </div>
</body>
</html>
